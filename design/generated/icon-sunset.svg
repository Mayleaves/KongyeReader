        <line x1="65" y1="124" x2="80" y2="127" stroke="#777777" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="67" y1="133" x2="80" y2="133" stroke="#777777" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="175" y1="124" x2="160" y2="127" stroke="#777777" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="173" y1="133" x2="160" y2="133" stroke="#777777" stroke-width="2.4" stroke-linecap="round"/>
        <ellipse cx="120" cy="121" rx="46" ry="41" fill="#1B1B1B"/>
        <circle cx="99" cy="126" r="14.5" fill="#FFFFFF"/>
        <circle cx="141" cy="126" r="14.5" fill="#FFFFFF"/>
        <circle cx="101" cy="126" r="6.8" fill="#18181B"/>
        <circle cx="139" cy="126" r="6.8" fill="#18181B"/>
        <circle cx="104" cy="122.5" r="2.2" fill="#FFFFFF"/>
        <circle cx="142" cy="122.5" r="2.2" fill="#FFFFFF"/>
        <path d="M113 139.5 Q116.5 143.5 120 139.5 Q123.5 143.5 127 139.5" stroke="#52525B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 2. 底部双叶托底 (左侧实心叶 + 右侧镂空叶带叶脉斜线) -->
    <g>
        <!-- 书卷底部背景遮罩衬底 -->
        <path d="M 88 334 C 166 334, 224 358, 256 398 C 288 358, 346 334, 424 334 C 424 410, 354 446, 256 446 C 158 446, 88 410, 88 334 Z" fill="#FAF8F5"/>
        <!-- 左侧实心黑叶 -->
        <path d="M 96 338 C 168 338, 226 362, 256 402 C 212 436, 128 428, 96 338 Z" fill="#1B1B1B"/>

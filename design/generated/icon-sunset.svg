        <path d="M 286 390 Q 336 378 376 356" fill="none" stroke="#1B1B1B" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- 3. 扒在左右叶片上沿的两只圆润黑色小猫手 -->
    <g>
        <ellipse cx="178" cy="340" rx="21" ry="13.5" fill="#1B1B1B" stroke="#FAF8F5" stroke-width="5.5"/>
        <ellipse cx="334" cy="340" rx="21" ry="13.5" fill="#1B1B1B" stroke="#FAF8F5" stroke-width="5.5"/>

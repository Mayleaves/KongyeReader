<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%" fill="none">
    <style>
        @keyframes catBreathe { 0%, 100% { transform: scaleY(1) translateY(0); } 50% { transform: scaleY(1.018) translateY(-1.8px); } }
        @keyframes tailSway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(11deg); } }
        @keyframes tailSleepBreathe { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.2deg); } }
        @keyframes earTwitchLeft { 0%, 84%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-4.5deg); } 93% { transform: rotate(1.5deg); } }
        @keyframes earTwitchRight { 0%, 60%, 100% { transform: rotate(0deg); } 64% { transform: rotate(4.5deg); } 68% { transform: rotate(0deg); } }
        @keyframes leafFloat { 0%, 100% { transform: rotate(-5deg) translateY(0px); } 50% { transform: rotate(7deg) translateY(-2.5px); } }
        @keyframes eyeBlink { 0%, 45%, 49%, 94%, 98%, 100% { transform: scaleY(1); } 47%, 96% { transform: scaleY(0.06); } }
        @keyframes zzzBubble1 { 0% { opacity: 0; transform: translate(0, 4px) scale(0.65); } 35% { opacity: 0.92; } 100% { opacity: 0; transform: translate(14px, -22px) scale(1.1); } }
        @keyframes zzzBubble2 { 0%, 22% { opacity: 0; transform: translate(0, 4px) scale(0.55); } 60% { opacity: 0.9; } 100% { opacity: 0; transform: translate(22px, -34px) scale(1.2); } }
        @keyframes heartFloatBouncy {
            0%, 100% { transform: translateY(3px) scale(0.86); opacity: 0.12; }
            50% { transform: translateY(-6px) scale(1.08); opacity: 1; }
        }
        @keyframes cheekPulse { 0%, 100% { transform: scale(1); opacity: 0.72; } 50% { transform: scale(1.12); opacity: 0.95; } }
        .svg-cat-breathe { animation: catBreathe 3.8s ease-in-out infinite; transform-origin: 120px 232px; }
        .svg-cat-tail { animation: tailSway 3.1s ease-in-out infinite; transform-origin: 154px 218px; }
        .svg-cat-tail-sleep { animation: tailSleepBreathe 4.5s ease-in-out infinite; transform-origin: 150px 220px; }
        .svg-ear-l { animation: earTwitchLeft 6.5s ease-in-out infinite; transform-origin: 96px 104px; }
        .svg-ear-r { animation: earTwitchRight 7.8s ease-in-out infinite; transform-origin: 144px 104px; }
        .svg-head-leaf { animation: leafFloat 3.4s ease-in-out infinite; transform-origin: 120px 76px; }
        .svg-eye-blink { animation: eyeBlink 5.4s infinite; transform-origin: 120px 125px; }
        .svg-zzz-1 { animation: zzzBubble1 2.8s ease-out infinite; }
        .svg-zzz-2 { animation: zzzBubble2 2.8s ease-out infinite; }
        .svg-heart-1 { animation: heartFloatBouncy 2.4s ease-in-out infinite 0s; transform-origin: 52px 62px; }
        .svg-heart-2 { animation: heartFloatBouncy 2.4s ease-in-out infinite 0.5s; transform-origin: 61px 86px; }
        .svg-heart-3 { animation: heartFloatBouncy 2.4s ease-in-out infinite 1.0s; transform-origin: 63px 152px; }
        .svg-heart-4 { animation: heartFloatBouncy 2.4s ease-in-out infinite 0.3s; transform-origin: 177px 83px; }
        .svg-heart-5 { animation: heartFloatBouncy 2.4s ease-in-out infinite 0.8s; transform-origin: 179px 107px; }
        .svg-cheek-pulse { animation: cheekPulse 1.8s ease-in-out infinite; transform-origin: 120px 134px; }
    </style>

    <!-- 底部椭圆柔和投影 -->
    <ellipse cx="120" cy="233" rx="54" ry="6.5" fill="#EFEFEF"/>

    <!-- 专注/开心状态：向上翘起摇晃的猫尾巴 -->
    <path class="svg-cat-tail" d="M150 222 C184 222, 196 196, 185 173" stroke="#1E1E22" stroke-width="11" stroke-linecap="round" fill="none"/>

    <!-- 猫猫呼吸主躯干 -->
    <g class="svg-cat-breathe">
        <!-- 圆润坐姿身体 -->
        <path d="M77 231 C77 174, 93 156, 120 156 C147 156, 163 174, 163 231 Z" fill="#1E1E22"/>

        <!-- 标志性前腿分割线 -->
        <line x1="106" y1="194" x2="106" y2="228.5" stroke="#47474E" stroke-width="3.2" stroke-linecap="round"/>
        <line x1="134" y1="194" x2="134" y2="228.5" stroke="#47474E" stroke-width="3.2" stroke-linecap="round"/>
        <!-- 胸前极简小领结纹理 -->
        <path d="M115 169 L120 174 L125 169" stroke="#47474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

        <!-- 左耳 (外侧边缘从 M74.4 116 顺着猫头椭圆切线无缝向上延伸，彻底消除接缝缺口) -->
        <g class="svg-ear-l">
            <path d="M74.4 116 C74.4 98, 79 74, 82 59 C83.2 53.5, 90 52.5, 94.2 57.5 L116 86 L108 118 Z" fill="#1E1E22"/>
            <path d="M84 89 L87 69 L98 83" stroke="#3A3A40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- 右耳 (外侧边缘从 M165.6 116 顺着猫头椭圆切线无缝向上延伸) -->
        <g class="svg-ear-r">
            <path d="M165.6 116 C165.6 98, 161 74, 158 59 C156.8 53.5, 150 52.5, 145.8 57.5 L124 86 L132 118 Z" fill="#1E1E22"/>
            <path d="M156 89 L153 69 L142 83" stroke="#3A3A40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- 头顶灵魂设计：「空叶」呆毛 -->
        <g class="svg-head-leaf">
            <path d="M120 79 C120 66, 128 53, 138 56 C138 67, 129 76, 120 79 Z" stroke="#27272A" stroke-width="2.4" stroke-linejoin="round" fill="none"/>
            <path d="M120 79 C117 70, 111 65, 107 67" stroke="#27272A" stroke-width="2" stroke-linecap="round" fill="none"/>
        </g>

        <!-- 饱满圆润猫头 (无异色描边，与双耳同色一体融合) -->
        <!-- 两侧灵动小胡须 -->
        <line x1="66" y1="124" x2="75" y2="126" stroke="#47474E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <line x1="68" y1="133" x2="76" y2="133" stroke="#47474E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <line x1="174" y1="124" x2="165" y2="126" stroke="#47474E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <line x1="172" y1="133" x2="164" y2="133" stroke="#47474E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <ellipse cx="120" cy="121" rx="46" ry="41" fill="#1E1E22"/>



                    <!-- 专注伴读大眼睛 (带自然眨眼动画与星光高光) -->
                    <g class="svg-eye-blink">
                        <circle cx="99" cy="126" r="14.5" fill="#FFFFFF"/>
                        <circle cx="141" cy="126" r="14.5" fill="#FFFFFF"/>
                        <circle cx="101" cy="126" r="6.8" fill="#18181B"/>
                        <circle cx="139" cy="126" r="6.8" fill="#18181B"/>
                        <circle cx="104" cy="122.5" r="2.2" fill="#FFFFFF"/>
                        <circle cx="142" cy="122.5" r="2.2" fill="#FFFFFF"/>
                    </g>
                    <!-- 经典 W 猫猫嘴 -->
                    <path d="M113 139.5 Q116.5 143.5 120 139.5 Q123.5 143.5 127 139.5" stroke="#52525B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    </g>


</svg>

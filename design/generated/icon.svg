<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="sunsetGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF7E67"/>
            <stop offset="100%" stop-color="#FFB88C" stop-opacity="0.25"/>
        </linearGradient>
    </defs>

    <!-- 图标底板 -->
    <rect width="512" height="512" rx="115" fill="#FFFFFF"/>
    <rect x="2" y="2" width="508" height="508" rx="113" stroke="#E4E4E7" stroke-width="4" opacity="0.5"/>



    <!-- 1. 看板猫猫头主体 (居中黄金比例放大) -->
    <g transform="translate(8, 22) scale(2.06)">
        <!-- 左耳 (无痕切线衔接) -->
        <path d="M74.4 116 C74.4 98, 79 74, 82 59 C83.2 53.5, 90 52.5, 94.2 57.5 L116 86 L108 118 Z" fill="#1E1E22"/>
        <path d="M84 89 L87 69 L98 83" stroke="#3A3A40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- 右耳 (无痕切线衔接) -->
        <path d="M165.6 116 C165.6 98, 161 74, 158 59 C156.8 53.5, 150 52.5, 145.8 57.5 L124 86 L132 118 Z" fill="#1E1E22"/>
        <path d="M156 89 L153 69 L142 83" stroke="#3A3A40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- 头顶「空叶」呆毛与小分枝 -->
        <path d="M120 79 C120 66, 128 53, 138 56 C138 67, 129 76, 120 79 Z" stroke="#1E1E22" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
        <path d="M120 79 C117 70, 111 65, 107 67" stroke="#1E1E22" stroke-width="2.1" stroke-linecap="round" fill="none"/>

        <!-- 圆润猫头 -->
        <ellipse cx="120" cy="121" rx="46" ry="41" fill="#1E1E22"/>

        <!-- 两侧胡须 -->
        <line x1="65" y1="124" x2="75" y2="126" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="67" y1="133" x2="76" y2="133" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="175" y1="124" x2="165" y2="126" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="173" y1="133" x2="164" y2="133" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"/>

        <!-- 呆萌大眼睛 -->
        <circle cx="99" cy="126" r="14.5" fill="#FFFFFF"/>
        <circle cx="141" cy="126" r="14.5" fill="#FFFFFF"/>
        <circle cx="101" cy="126" r="6.8" fill="#18181B"/>
        <circle cx="139" cy="126" r="6.8" fill="#18181B"/>
        <circle cx="104" cy="122.5" r="2.2" fill="#FFFFFF"/>
        <circle cx="142" cy="122.5" r="2.2" fill="#FFFFFF"/>

        <!-- W 猫猫嘴 -->
        <path d="M113 139.5 Q116.5 143.5 120 139.5 Q123.5 143.5 127 139.5" stroke="#52525B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 2. 底部双叶托底 (图1造型：左侧实心叶 + 右侧镂空叶带叶脉斜线) -->
    <g>
        <!-- 白色衬底遮罩，隔开猫下巴与双叶交界 -->
        <path d="M88 338 C164 344, 222 368, 256 412 C290 368, 348 344, 424 338 C406 426, 336 446, 256 446 C176 446, 106 426, 88 338 Z" fill="#FFFFFF"/>

        <!-- 左侧：实心黑叶 -->
        <path d="M256 414 C220 368, 162 344, 94 338 C114 418, 190 442, 256 414 Z" fill="#1E1E22" stroke="#1E1E22" stroke-width="10" stroke-linejoin="round"/>

        <!-- 右侧：镂空叶 + 内部叶脉斜线 -->
        <path d="M256 414 C292 368, 350 344, 418 338 C398 418, 322 442, 256 414 Z" fill="#FFFFFF" stroke="#1E1E22" stroke-width="12" stroke-linejoin="round"/>
        <path d="M294 396 Q342 380 378 364" stroke="#1E1E22" stroke-width="10" stroke-linecap="round"/>

        <!-- 3. 扒在左右叶片上沿的两只圆润黑色小猫手 -->
        <ellipse cx="184" cy="358" rx="22" ry="14" transform="rotate(14 184 358)" fill="#1E1E22" stroke="#FFFFFF" stroke-width="6"/>
        <ellipse cx="328" cy="358" rx="22" ry="14" transform="rotate(-14 328 358)" fill="#1E1E22" stroke="#FFFFFF" stroke-width="6"/>
    </g>
</svg>

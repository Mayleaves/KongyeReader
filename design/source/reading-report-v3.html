<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden"><defs>
<symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
<symbol id="share" viewBox="0 0 24 24"><path d="m8 11 8-5M8 13l8 5"/><circle cx="5.5" cy="12" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></symbol>
<symbol id="timeline" viewBox="0 0 24 24"><path d="M5 3v18M10 6h11M10 12h8M10 18h11"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</defs></svg>
<main class="app">
  <header class="topbar"><button class="icon-button" id="back-button" aria-label="返回"><svg><use href="#back"/></svg></button><h1>统计</h1><div class="actions"><button class="icon-button" id="open-report" aria-label="分享阅读报告"><svg><use href="#share"/></svg></button><button class="icon-button" id="open-timeline" aria-label="阅读时间轴"><svg><use href="#timeline"/></svg></button></div></header>
  <div class="content">
    <nav class="segmented" role="tablist" aria-label="统计范围"><button role="tab" data-period="week" aria-selected="false">周</button><button role="tab" data-period="month" aria-selected="true">月</button><button role="tab" data-period="year" aria-selected="false">年</button><button role="tab" data-period="all" aria-selected="false">总</button></nav>
    <div class="period-nav"><button id="previous" class="icon-button" aria-label="上一时段"><svg><use href="#left"/></svg></button><div class="period-label"><span id="period-label"></span><button class="now" id="return-now" hidden>回到当前</button></div><button id="next" class="icon-button" aria-label="下一时段"><svg><use href="#right"/></svg></button></div>
    <section class="card" aria-labelledby="overview-title"><h2 id="overview-title">月概览</h2><div class="metrics" id="metrics"></div></section>
    <section class="card" aria-labelledby="trend-title"><h2 id="trend-title">趋势</h2><p class="subtitle" id="average"></p><svg class="trend" id="trend" viewBox="0 0 480 212" role="img" aria-label="阅读时长趋势图"></svg></section>
    <section class="card" aria-labelledby="distribution-title"><h2 id="distribution-title">分布</h2><div class="distribution" id="distribution"></div></section>
    <section class="card" aria-labelledby="heat-title"><div class="heat-title"><h2 id="heat-title">热力图</h2><span class="heat-total" id="heat-total"></span></div><div class="heatmap" id="heatmap" aria-label="每日阅读热力图"></div><div class="heat-legend" id="heat-legend"></div></section>
    <footer class="footer"><span>交互演示 · 示例阅读数据</span><button class="theme-button" id="theme-toggle">切换深色</button></footer>
  </div>
</main>
<dialog id="report-dialog" aria-labelledby="report-heading">
  <div class="handle"></div>
  <div class="dialog-title">
    <div>
      <h2 id="report-heading">分享阅读报告</h2>
      <p class="subtitle" id="report-range"></p>
    </div>
    <button class="icon-button" data-close aria-label="关闭分享预览"><svg><use href="#close"/></svg></button>
  </div>
  <div class="report-stage">
    <canvas id="report-canvas" class="report-preview" width="1080" height="1620" aria-label="阅读报告预览"></canvas>
  </div>
  <div class="report-options">
    <div class="report-row stack" role="radiogroup" aria-label="商城图标同款色系">
      <div class="row-head"><span>图标同款主题</span><small id="active-icon-name">落日·经典</small></div>
      <div class="icon-strip">
        <button type="button" class="theme-pill" role="radio" data-rtheme="light" aria-checked="false"><i style="background:linear-gradient(135deg,#ffffff 52%,#1e1e22 52%)"></i><span>浅色</span></button>
        <button type="button" class="theme-pill" role="radio" data-rtheme="sunset" aria-checked="true"><i style="background:radial-gradient(circle at 32% 32%,#ff8a7a,#f9f8f4 68%)"></i><span>落日</span></button>
        <button type="button" class="theme-pill" role="radio" data-rtheme="gold" aria-checked="false"><i style="background:linear-gradient(135deg,#131217 50%,#f6b525 50%)"></i><span>暗金浮雕</span></button>
        <button type="button" class="theme-pill" role="radio" data-rtheme="neon" aria-checked="false"><i style="background:linear-gradient(135deg,#121020 30%,#36bcc7 65%,#fa2c7e 100%)"></i><span>霓虹幻彩</span></button>
        <button type="button" class="theme-pill" role="radio" data-rtheme="pixel" aria-checked="false"><i style="background:linear-gradient(135deg,#f3efe6 52%,#e09224 52%)"></i><span>像素复古</span></button>
      </div>
    </div>
    <div class="report-row" role="radiogroup" aria-label="图标构图款式">
      <span>图标款式</span>
      <div class="variant-seg">
        <button type="button" class="variant-btn" role="radio" data-rvariant="classic" aria-checked="true">经典</button>
        <button type="button" class="variant-btn" role="radio" data-rvariant="minimal" aria-checked="false">极简</button>
      </div>
    </div>
    <label class="privacy report-row"><span>显示在读书名</span><input id="show-books" class="switch" type="checkbox" role="switch" checked></label>
  </div>
  <div class="dialog-buttons">
    <button id="save-report" class="button secondary">保存图片</button>
    <button id="share-report" class="button">分享海报</button>
  </div>
</dialog>
<dialog id="timeline-dialog" aria-labelledby="timeline-heading"><div class="handle"></div><div class="dialog-title"><h2 id="timeline-heading">阅读时间轴</h2><button class="icon-button" data-close aria-label="关闭时间轴"><svg><use href="#close"/></svg></button></div><p class="subtitle">当前统计范围 · 示例记录</p><div id="timeline-list" class="timeline-list"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// 文件内所有记录均为生成的演示数据；无联网请求，无用户信息读取。
const CAT_PATHS = {"153": "M21.36 65.26a12.29 12.29 0 1 0 24.58 0a12.29 12.29 0 1 0 -24.58 0Z", "154": "M24.37 65.26a9.28 9.28 0 1 0 18.56 0a9.28 9.28 0 1 0 -18.56 0Z", "155": "M35.19 62.07a1.64 2.55 0 1 0 3.28 0a1.64 2.55 0 1 0 -3.28 0Z", "156": "M63.23 65.26a12.29 12.29 0 1 0 24.58 0a12.29 12.29 0 1 0 -24.58 0Z", "157": "M66.24 65.26a9.28 9.28 0 1 0 18.56 0a9.28 9.28 0 1 0 -18.56 0Z", "158": "M77.06 62.07a1.64 2.55 0 1 0 3.28 0a1.64 2.55 0 1 0 -3.28 0Z", "159": "M50.67 66.94a3.91 2.2 0 1 0 7.82 0a3.91 2.2 0 1 0 -7.82 0Z", "160": "M54.58,73.01v7.34M54.58,80.35l-3.67,3.06M54.58,80.35l3.67,3.06", "161": "M51.5,37.36c-3-13.5,4-25.5,19-27.5-1,15-9,25-19,27.5Z", "162": "M51.5,37.36c4.67-9,10-17.17,16-24.5", "163": "M53.5,21.86l3.8,5.2,5.7.3", "164": "M59,15.86l3,4.2,4.5.3", "165": "M52.46 67.74a3.98 2.24 0 1 0 7.96 0a3.98 2.24 0 1 0 -7.96 0Z", "166": "M56.44,73.92v7.47M56.44,81.4l-3.74,3.11M56.44,81.4l3.74,3.11", "167": "M87.45,62.21c-6.89-.75-12.98.89-18.28,4.94", "168": "M43.71,67.15c-5.3-4.05-11.39-5.69-18.28-4.94"};
const $ = selector => document.querySelector(selector);
const today = new Date(); today.setHours(0,0,0,0);
const date = (y,m,d) => new Date(y,m,d);
const addDays = (d,n) => date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const md = d => `${d.getMonth()+1}月${d.getDate()}日`;
const monday = d => addDays(d,-(d.getDay()+6)%7);
const hm = v => { const m=Math.floor(v),h=Math.floor(m/60);return h ? `${h}h${m%60 ? m%60+'m':''}` : `${m}m`; };
const duration = v => {const m=Math.floor(v),h=Math.floor(m/60);return h?`${h}<small>时</small>${m%60?m%60+'<small>分</small>':''}`:`${m}<small>分钟</small>`;};
const cn = v => {const m=Math.floor(v),h=Math.floor(m/60);return h?`${h}时${m%60?m%60+'分':''}`:`${m}分钟`;};
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles=['小王子','月亮与六便士','山茶文具店','在书页间散步','一间自己的房间'];
const records=[];
for(let d=date(today.getFullYear()-2,0,1);d<=today;d=addDays(d,1)){
  const code=d.getFullYear()*370+(d.getMonth()+1)*31+d.getDate();
  if(code%7===0 || code%11===0) continue;
  const min=8+(code*17)%76,book=(Math.floor(code/9))%titles.length;
  records.push({date:new Date(d),book,minutes:min,finished:code%83===0});
  if(code%4===0)records.push({date:new Date(d),book:(book+1)%titles.length,minutes:4+code%19,finished:false});
}
let period='month', anchor=new Date(today), selected=-1, model=null;
let toastTimer;
function toast(message){$('#toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',2600);}
function rangeFor(p,a){
  if(p==='week'){const from=monday(a);return[from,addDays(from,6)];}
  if(p==='month')return[date(a.getFullYear(),a.getMonth(),1),date(a.getFullYear(),a.getMonth()+1,0)];
  if(p==='year')return[date(a.getFullYear(),0,1),date(a.getFullYear(),11,31)];
  return[records[0]?.date || today,today];
}
function samePeriod(a,b){if(period==='all')return true;return key(rangeFor(period,a)[0])===key(rangeFor(period,b)[0]);}
function shifted(n){if(period==='week')return addDays(anchor,n*7);if(period==='month')return date(anchor.getFullYear(),anchor.getMonth()+n,1);return date(anchor.getFullYear()+n,0,1);}
function compute(){
  const [from,to]=rangeFor(period,anchor), list=records.filter(r=>r.date>=from&&r.date<=to),days=new Map(),dist=new Map();
  for(const r of list){days.set(key(r.date),(days.get(key(r.date))||0)+r.minutes);dist.set(r.book,(dist.get(r.book)||0)+r.minutes);}
  let bars=[];
  if(period==='week'||period==='month')for(let d=new Date(from);d<=to;d=addDays(d,1))bars.push({label:period==='week'?['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]:String(d.getDate()),value:days.get(key(d))||0,future:d>today,current:key(d)===key(today),showLabel:period==='week'||d.getDate()===1||d.getDate()%5===0});
  else if(period==='year')for(let m=0;m<12;m++)bars.push({label:`${m+1}月`,value:list.filter(r=>r.date.getMonth()===m).reduce((s,r)=>s+r.minutes,0),future:date(anchor.getFullYear(),m,1)>today,current:anchor.getFullYear()===today.getFullYear()&&m===today.getMonth(),showLabel:true});
  else for(let y=from.getFullYear();y<=today.getFullYear();y++)bars.push({label:String(y),value:list.filter(r=>r.date.getFullYear()===y).reduce((s,r)=>s+r.minutes,0),future:false,current:y===today.getFullYear(),showLabel:true});
  const total=list.reduce((s,r)=>s+r.minutes,0), now=samePeriod(anchor,today);
  const word=period==='week'?(now?'本周':'当周'):period==='month'?(now?'本月':'当月'):period==='year'?(now?'今年':'当年'):'累计';
  const label=period==='week'?`${md(from)} - ${md(to)}`:period==='month'?`${anchor.getFullYear()}年${anchor.getMonth()+1}月`:period==='year'?`${anchor.getFullYear()}年`:'全部记录';
  const allDays=new Set(records.map(r=>key(r.date))); let streak=0,d=new Date(today);if(!allDays.has(key(d)))d=addDays(d,-1);while(allDays.has(key(d))){streak++;d=addDays(d,-1);}
  return{from,to,list,bars,total,word,label,days:days.size,count:list.length,finished:new Set(list.filter(r=>r.finished).map(r=>r.book)).size,streak,avg:total/Math.max(1,bars.filter(b=>!b.future).length),dist:[...dist].sort((a,b)=>b[1]-a[1])};
}
function render(){
  model=compute();const m=model;
  document.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.period===period)));

function getGrainPattern(ctx, color) {
  if (grainCache[color]) return grainCache[color];
  const off = document.createElement('canvas');
  off.width = 140; off.height = 140;
  const octx = off.getContext('2d');
  octx.fillStyle = color;
  let seed = 42;
  for (let i = 0; i < 420; i++) {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    const x = seed % 140;
    seed = (seed * 1664525 + 1013904223) >>> 0;
    const y = seed % 140;
    octx.fillRect(x, y, (i % 3 === 0) ? 2 : 1, 1);
  }
  return (grainCache[color] = ctx.createPattern(off, 'repeat'));
}

function rrect(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, rad);
  else {
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
}

function topCapsule(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);

    ? 'M132 89 C133 65, 127 47, 123 44 C119 42, 109 57, 103 72 Z'
    : 'M131 89 C132 71, 127 55, 123 52 C119 50, 110 61, 104 74 Z');

  ctx.fillStyle = bodyFill;
  ctx.fill(earL);
  ctx.fillStyle = isNeon ? '#B81D5E' : bodyFill;
  ctx.fill(earR);

  ctx.fillStyle = bodyFill;
  ctx.beginPath();
  ctx.ellipse(100, 99, 35, 31, 0, 0, Math.PI * 2);
  ctx.fill();

  // 暗金浮雕金边 / 霓虹双色发光边
  if (isGold || isNeon) {
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = isGold ? '#DDA12C' : '#36BCC7';
    ctx.stroke(earL);
    ctx.strokeStyle = isGold ? '#DDA12C' : '#FA2C7E';
    ctx.stroke(earR);
    ctx.strokeStyle = isGold ? '#9A7125' : '#2C3159';
    ctx.beginPath();
    ctx.ellipse(100, 99, 35, 31, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 耳廓内折线
  ctx.lineWidth = 2.1;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = isGold ? '#D69B2A' : isNeon ? '#36BCC7' : '#FFFFFF';
  ctx.stroke(new Path2D(variant === 'classic' ? 'M76 74 L79 56 L88 69' : 'M77 75 L79 60 L87 70'));
  ctx.strokeStyle = isGold ? '#D69B2A' : isNeon ? '#FFD6E7' : '#FFFFFF';
  ctx.stroke(new Path2D(variant === 'classic' ? 'M124 74 L121 56 L112 69' : 'M123 75 L121 60 L113 70'));

  // 胡须
  ctx.lineWidth = 2.0;
  ctx.strokeStyle = isGold ? '#8C6D32' : isNeon ? '#36BCC7' : '#52525B';
  ctx.beginPath();
  ctx.moveTo(54, 99); ctx.lineTo(62, 100);
  ctx.moveTo(55, 106); ctx.lineTo(62, 106);
  ctx.stroke();
  ctx.strokeStyle = isGold ? '#8C6D32' : isNeon ? '#FA2C7E' : '#52525B';
  ctx.beginPath();
  ctx.moveTo(146, 99); ctx.lineTo(138, 100);
  ctx.moveTo(145, 106); ctx.lineTo(138, 106);
  ctx.stroke();

  // 双眼（霓虹异瞳 / 暗金暖眸 / 经典纯白）
  ctx.fillStyle = isNeon ? '#36BCC7' : isGold ? '#F6D588' : '#FFFFFF';
  ctx.beginPath(); ctx.arc(84, 102, 10.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = isNeon ? '#FA2C7E' : isGold ? '#F6D588' : '#FFFFFF';
  ctx.beginPath(); ctx.arc(116, 102, 10.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#141417';
  ctx.beginPath();
  ctx.arc(85.5, 102, 5.0, 0, Math.PI * 2);
  ctx.arc(114.5, 102, 5.0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(87.5, 99.5, 1.7, 0, Math.PI * 2);
  ctx.arc(116.5, 99.5, 1.7, 0, Math.PI * 2);
  ctx.fill();

  // 小嘴
  ctx.strokeStyle = isGold ? '#B88930' : isNeon ? '#8E92B2' : '#686870';
  ctx.lineWidth = 2.1;
  ctx.stroke(new Path2D('M95 113 Q97.5 116 100 113 Q102.5 116 105 113'));

  // 底部一实一空托叶（空叶阅读核心符号）
  const leafLeft = new Path2D('M99 154 C74 156, 52 143, 46 125 C67 124, 86 134, 99 154 Z');
  const leafRight = new Path2D('M101 154 C126 156, 148 143, 154 125 C133 124, 114 134, 101 154 Z');

  if (isGold) {
    const gGrad = ctx.createLinearGradient(46, 125, 99, 155);
    gGrad.addColorStop(0, '#FFD25A');
    gGrad.addColorStop(1, '#C96D12');
    ctx.fillStyle = gGrad;
  } else if (isNeon) {
    ctx.fillStyle = '#FA2C7E';
  } else {
    ctx.fillStyle = '#1B1B1F';
  }
  ctx.fill(leafLeft);

  ctx.fillStyle = withTile ? t.iconBg : t.panel;
  ctx.fill(leafRight);
  ctx.lineWidth = 3.2;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = isGold ? '#F6B525' : isNeon ? '#36BCC7' : '#1B1B1F';
  ctx.stroke(leafRight);

  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.stroke(new Path2D('M105 150 C119 145, 133 138, 145 129'));

  ctx.restore();
}

function drawSeal(ctx, x, y, size, t, chars) {
  ctx.save();
  rrect(ctx, x, y, size, size, reportTheme === 'pixel' ? 6 : 12);
  ctx.fillStyle = t.sealSoft;
  ctx.fill();
  ctx.strokeStyle = t.sealColor;
  ctx.globalAlpha = 0.84;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.globalAlpha = 0.22;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + size / 2, y + 9); ctx.lineTo(x + size / 2, y + size - 9);
  ctx.moveTo(x + 9, y + size / 2); ctx.lineTo(x + size - 9, y + size / 2);
  ctx.stroke();

  ctx.globalAlpha = 0.94;
  ctx.fillStyle = t.sealColor;
  ctx.font = '600 21px "Songti SC","Noto Serif SC","SimSun",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const q = size / 4;
  ctx.fillText(chars[0], x + q * 3, y + q + 1);
  ctx.fillText(chars[1], x + q * 3, y + q * 3 + 1);
  ctx.fillText(chars[2], x + q, y + q + 1);
  ctx.fillText(chars[3], x + q, y + q * 3 + 1);
  ctx.restore();
}

async function drawReport() {
  const m = model, c = $('#report-canvas'), ctx = c.getContext('2d');
  const show = $('#show-books').checked, t = REPORT_THEMES[reportTheme] || REPORT_THEMES.sunset;
  const isPixel = reportTheme === 'pixel';
  const W = 1080, H = 1620;
  const fontStack = isPixel
    ? 'ui-monospace,"SFMono-Regular","Cascadia Mono","Microsoft YaHei",sans-serif'
    : 'system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

  function fitText(str, maxW) {
    let v = String(str);
    if (ctx.measureText(v).width <= maxW) return v;
    while (v.length && ctx.measureText(v + '…').width > maxW) v = v.slice(0, -1);
    return v + '…';
  }
  function text(val, x, y, size, color = t.ink, weight = 400, maxW = 900, align = 'left') {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = `${weight} ${size}px ${fontStack}`;
    ctx.textAlign = align;
    ctx.fillText(fitText(val, maxW), x, y);
    ctx.restore();
  }
  function hairline(x1, y1, x2, y2, color = t.line, width = 1.2) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  // 1. 外衬底与主海报卡片
  ctx.fillStyle = t.mat;
  ctx.fillRect(0, 0, W, H);

  const outerR = isPixel ? 18 : 40;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.10)';
  ctx.shadowBlur = 32;
  ctx.shadowOffsetY = 10;
  rrect(ctx, 38, 38, W - 76, H - 76, outerR);
  ctx.fillStyle = t.card;
  ctx.fill();
  ctx.restore();

  ctx.save();
  rrect(ctx, 38, 38, W - 76, H - 76, outerR);
  ctx.clip();
  ctx.fillStyle = getGrainPattern(ctx, t.grain);
  ctx.fillRect(38, 38, W - 76, H - 76);
  ctx.restore();

  rrect(ctx, 38, 38, W - 76, H - 76, outerR);
  ctx.strokeStyle = t.line;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  rrect(ctx, 64, 64, W - 128, H - 128, isPixel ? 10 : 26);
  ctx.strokeStyle = t.line;
  ctx.lineWidth = 1;
  ctx.stroke();

  // 2. 眉题与闲章
  ctx.fillStyle = t.sealColor;
  rrect(ctx, 104, 107, 4, 20, 2);
  ctx.fill();
  text('空叶阅读  ·  READING JOURNAL', 120, 125, 22, t.muted, 600, 560);

  const periodCode = { week: 'WEEKLY EDITION', month: 'MONTHLY EDITION', year: 'ANNUAL EDITION', all: 'ARCHIVE EDITION' }[period];
  text(periodCode, 976, 125, 20, t.soft, 600, 280, 'right');

  const title = { week: '我的阅读周报', month: '我的阅读月报', year: '我的阅读年报', all: '我的阅读足迹' }[period];
  text(title, 104, 204, 58, t.ink, 750, 760);
  text(`${m.label}  ·  共翻开书页 ${m.count} 次`, 106, 252, 25, t.muted, 400, 760);

  const sealText = { week: '一叶知秋', month: '静享阅读', year: '岁阅成诗', all: '书页留痕' }[period];
  drawSeal(ctx, 902, 162, 74, t, sealText);

  // 3. 主视觉卡片：核心阅读时长 + 同款商城图标主视觉
  rrect(ctx, 100, 290, 880, 396, isPixel ? 12 : 28);
  ctx.fillStyle = t.panel;
  ctx.fill();
  ctx.strokeStyle = t.line;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  text('留给阅读的时间', 142, 350, 25, t.muted, 500, 480);

  const totalMin = Math.floor(m.total);
  const hrs = Math.floor(totalMin / 60), mins = totalMin % 60;
  const segs = hrs > 0
    ? (mins > 0 ? [{ n: String(hrs), u: '小时' }, { n: String(mins), u: '分' }] : [{ n: String(hrs), u: '小时' }])
    : [{ n: String(mins), u: '分钟' }];

  let numSize = 90, unitSize = 27;
  const rawW = segs.reduce((acc, s, idx) => {
    ctx.font = `800 ${numSize}px ${fontStack}`;
    const nw = ctx.measureText(s.n).width;
    ctx.font = `500 ${unitSize}px ${fontStack}`;
    const uw = ctx.measureText(s.u).width;
    return acc + nw + 6 + uw + (idx < segs.length - 1 ? 14 : 0);
  }, 0);
  if (rawW > 495) {
    const ratio = 495 / rawW;
    numSize = Math.floor(numSize * ratio);
    unitSize = Math.max(20, Math.floor(unitSize * ratio));
  }
  let curX = 140;
  segs.forEach((s, idx) => {
    ctx.fillStyle = t.ink;
    ctx.font = `800 ${numSize}px ${fontStack}`;
    ctx.fillText(s.n, curX, 458);
    curX += ctx.measureText(s.n).width + 6;
    ctx.fillStyle = t.muted;
    ctx.font = `500 ${unitSize}px ${fontStack}`;
    ctx.fillText(s.u, curX, 456);
    curX += ctx.measureText(s.u).width + (idx < segs.length - 1 ? 14 : 0);
  });

  hairline(142, 508, 642, 508, t.line, 1);

  const subMetrics = [
    [String(m.days), '天', '阅读天数'],
    [String(m.finished), '本', '读完书籍'],
    [String(m.streak), '天', '连续阅读']
  ];
  subMetrics.forEach(([num, unit, lbl], idx) => {
    const mx = 142 + idx * 172;
    if (idx > 0) hairline(mx - 22, 540, mx - 22, 638, t.line, 1);
    ctx.fillStyle = t.ink;
    ctx.font = `750 40px ${fontStack}`;
    ctx.fillText(num, mx, 586);
    const nw = ctx.measureText(num).width;
    ctx.fillStyle = t.muted;
    ctx.font = `500 21px ${fontStack}`;
    ctx.fillText(unit, mx + nw + 5, 584);
    text(lbl, mx, 630, 22, t.muted, 400, 145);
  });

  // 右侧圆晕衬底 + 对应商城图标形象
  ctx.save();
  ctx.fillStyle = t.halo;
  if (isPixel) {
    rrect(ctx, 694, 366, 244, 244, 20);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(816, 488, 124, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = t.line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(816, 488, 134, -Math.PI * 0.78, Math.PI * 0.25);
    ctx.stroke();
  }
  ctx.restore();

  // 落日固定在圆晕左上方，不随首页动物改变位置。
  if (reportTheme === 'sunset') {
    ctx.save();
    ctx.beginPath(); ctx.arc(816, 488, 124, 0, Math.PI * 2); ctx.clip();
    const sun = ctx.createRadialGradient(764, 430, 3, 764, 430, 42);
    sun.addColorStop(0, 'rgba(255,116,96,0.82)');
    sun.addColorStop(0.48, 'rgba(255,127,108,0.50)');
    sun.addColorStop(1, 'rgba(255,146,125,0)');
    ctx.fillStyle = sun;
    ctx.fillRect(720, 386, 88, 88);
    ctx.restore();
  }

  drawAppIconArt(ctx, 816, 490, 232, reportTheme, reportVariant, false);

  // 4. 阅读节奏趋势图
  const bars = m.bars;
  const peakVal = Math.max(0, ...bars.map(b => b.value));
  const peakIdx = peakVal > 0 ? bars.findIndex(b => b.value === peakVal) : -1;
  const avgLabel = `${period === 'year' ? '月均' : period === 'all' ? '年均' : '日均'} ${hm(m.avg)}`;

  text('阅读的节奏', 104, 756, 30, t.ink, 700, 360);
  text(peakVal > 0 ? `${avgLabel}  ·  最高 ${hm(peakVal)}` : avgLabel, 976, 754, 23, t.muted, 500, 500, 'right');

  const chartX = 104, chartW = 872, baseY = 976, availH = 148;
  const maxV = Math.max(1, peakVal, m.avg);
  const slot = chartW / Math.max(1, bars.length);
  const barW = Math.min(bars.length <= 5 ? 52 : 34, Math.max(10, slot * 0.56));

  hairline(chartX, baseY - availH, chartX + chartW, baseY - availH, t.line, 0.8);
  if (m.avg > 0) {
    const avgY = baseY - (m.avg / maxV) * availH;
    ctx.save();
    ctx.strokeStyle = t.accentLine;
    ctx.lineWidth = 1.4;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(chartX, avgY);
    ctx.lineTo(chartX + chartW, avgY);
    ctx.stroke();
    ctx.restore();
  }

  let peakCenter = 0, peakTop = baseY;
  bars.forEach((b, i) => {
    const x = chartX + i * slot + (slot - barW) / 2;
    if (b.future) {
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = t.barEmpty;
      ctx.fill(new Path2D(topCapsule(x, baseY - 4, barW, 4, isPixel ? 0 : 2)));
      ctx.restore();
      return;
    }
    const h = b.value === 0 ? 5 : Math.max(8, (b.value / maxV) * availH);
    const y = baseY - h;
    if (i === peakIdx) {
      peakCenter = x + barW / 2;
      peakTop = y;
      ctx.fillStyle = reportTheme === 'light' ? '#D6452E' : t.accent;
    } else if (b.value === 0) {
      ctx.fillStyle = t.barEmpty;
    } else if (b.value < m.avg * 0.5) {
      ctx.fillStyle = t.barLow;
    } else {
      ctx.fillStyle = reportTheme === 'neon' ? t.accent2 : t.ink;
    }
    ctx.fill(new Path2D(topCapsule(x, y, barW, h, isPixel ? 0 : Math.min(barW / 2, 10))));
  });

  hairline(chartX, baseY, chartX + chartW, baseY, t.line, 1.4);

  bars.forEach((b, i) => {
    if (!b.showLabel) return;
    const cx = chartX + i * slot + slot / 2;
    const lbl = period === 'month' ? `${b.label}日` : b.label;
    text(lbl, cx, 1012, bars.length > 14 ? 20 : 22, b.current ? t.ink : t.muted, b.current ? 700 : 400, 80, 'center');
  });

  if (peakIdx >= 0 && peakVal > 0) {
    const pText = hm(peakVal);
    const pillColor = reportTheme === 'light' ? '#D6452E' : t.accent;
    ctx.font = `700 20px ${fontStack}`;
    const pw = ctx.measureText(pText).width + 24, ph = 32;
    const px = Math.min(chartX + chartW - pw / 2, Math.max(chartX + pw / 2, peakCenter));
    const py = Math.max(776, peakTop - ph - 8);
    rrect(ctx, px - pw / 2, py, pw, ph, isPixel ? 4 : 10);
    ctx.fillStyle = t.sealSoft;
    ctx.fill();
    ctx.strokeStyle = pillColor;
    ctx.lineWidth = 1;
    ctx.stroke();
    text(pText, px, py + 23, 20, pillColor, 700, pw, 'center');
  }

  hairline(104, 1058, 976, 1058, t.line, 1.2);

  // 5. 底部：在读书单 或 隐私寄语 + 近 28 日阅读印记
  if (show && m.dist.length > 0) {
    text('翻过的故事', 104, 1118, 30, t.ink, 700, 420);
    text(`共涉猎 ${m.dist.length} 本书`, 976, 1116, 23, t.muted, 500, 320, 'right');

    const topBooks = m.dist.slice(0, 3);
    topBooks.forEach(([id, value], i) => {
      const ry = 1156 + i * 90;
      const pct = Math.max(1, Math.round((value / Math.max(1, m.total)) * 100));
      const topAccent = reportTheme === 'light' ? '#D6452E' : t.accent;
      text(`0${i + 1}`, 104, ry + 32, 25, i === 0 ? topAccent : t.muted, 750, 50);
      text(`《${titles[id]}》`, 156, ry + 32, 28, t.ink, 600, 580);

      const durStr = hm(value), pctStr = `${pct}%`;
      ctx.font = `500 22px ${fontStack}`;
      const pctW = ctx.measureText(pctStr).width;
      text(pctStr, 976, ry + 31, 22, t.muted, 500, 90, 'right');
      text(durStr, 976 - pctW - 14, ry + 32, 26, t.ink, 700, 180, 'right');

      const barX = 156, barY = ry + 50, barTotalW = 820;
      rrect(ctx, barX, barY, barTotalW, 4, isPixel ? 0 : 2);
      ctx.fillStyle = t.barEmpty;
      ctx.fill();

      const fillW = Math.max(12, barTotalW * (value / Math.max(1, m.total)));
      rrect(ctx, barX, barY, fillW, 4, isPixel ? 0 : 2);
      ctx.save();
      if (i === 2) ctx.globalAlpha = 0.58;
      ctx.fillStyle = i === 0 ? topAccent : (reportTheme === 'neon' ? t.accent2 : t.ink);
      ctx.fill();
      ctx.restore();
    });
    if (topBooks.length < 3) {
      const noteY = 1156 + topBooks.length * 90 + 44;
      text('专注于少而精的阅读，每一页都更从容。', 104, noteY, 23, t.muted, 400, 760);
    }
  } else {
    rrect(ctx, 100, 1094, 880, 312, isPixel ? 12 : 26);
    ctx.fillStyle = t.panel;
    ctx.fill();
    ctx.strokeStyle = t.line;
    ctx.lineWidth = 1.1;
    ctx.stroke();

    ctx.save();
    ctx.fillStyle = t.sealColor;
    ctx.globalAlpha = 0.35;
    ctx.font = '700 72px Georgia,serif';
    ctx.fillText('“', 138, 1178);
    ctx.restore();

    let q1 = '在属于自己的节奏里，', q2 = '安安静静读完一本书。';
    if (m.total === 0) {
      q1 = '故事还很长，不必匆忙赶路，';
      q2 = '翻开第一页便是好时光。';
    } else if (m.streak >= 5) {
      q1 = '日复一日的安静翻阅，';
      q2 = '让散落的时光有了沉静的回响。';
    } else if (m.total >= 600) {
      q1 = '读过的每一页都算数，';
      q2 = '它们在沉默中拓宽生命的边界。';
    }
    text(q1, 144, 1222, 31, t.ink, 700, 515);
    text(q2, 144, 1274, 31, t.ink, 700, 515);

    const avgSession = m.count ? m.total / m.count : 0;
    text(`${m.word}沉浸 ${m.count} 次  ·  单次平均 ${cn(avgSession)}`, 144, 1354, 23, t.muted, 400, 515);

    hairline(684, 1136, 684, 1368, t.line, 1);

    text('近 28 日阅读印记', 832, 1158, 21, t.muted, 500, 220, 'center');
    const dayMap = new Map();
    for (const r of records) dayMap.set(key(r.date), (dayMap.get(key(r.date)) || 0) + r.minutes);

    const start28 = addDays(today, -27);
    let active28 = 0;
    const cellS = 22, gap = 7, gridX = 734, gridY = 1184;
    for (let idx = 0; idx < 28; idx++) {
      const d = addDays(start28, idx);
      const val = dayMap.get(key(d)) || 0;
      if (val > 0) active28++;
      const lv = val <= 0 ? 0 : val < 15 ? 1 : val < 30 ? 2 : val < 60 ? 3 : 4;
      const col = idx % 7, row = Math.floor(idx / 7);
      rrect(ctx, gridX + col * (cellS + gap), gridY + row * (cellS + gap), cellS, cellS, isPixel ? 0 : 5);
      ctx.fillStyle = key(d) === key(today) ? t.sealColor : t.heat[lv];
      ctx.fill();
    }
    text(`活跃 ${active28} / 28 天`, 832, 1354, 21, t.muted, 500, 220, 'center');
  }

  // 6. 简洁页脚：左侧叶子寄语，右侧品牌署名。
  hairline(104, 1442, 976, 1442, t.line, 1.2);
  ctx.save();
  ctx.translate(102, 1481);
  ctx.strokeStyle = t.sealColor;
  ctx.lineWidth = 1.7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke(new Path2D('M4 19C4 10 11 4 20 4C20 13 14 20 5 20ZM5 19L15 9'));
  ctx.restore();
  text('一叶知秋 · 静享阅读', 140, 1502, 22, t.muted, 400, 500);
  ctx.font = `500 20px ${fontStack}`;
  const latinW = ctx.measureText('KONGYE').width;
  text('KONGYE', 976, 1502, 20, t.soft, 500, 160, 'right');
  text('/', 976 - latinW - 15, 1502, 20, t.soft, 400, 30, 'right');
  text('空叶阅读', 976 - latinW - 40, 1502, 24, t.ink, 750, 220, 'right');
}

function syncReportControls() {
  document.querySelectorAll('[data-rtheme]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.rtheme === reportTheme)));
  document.querySelectorAll('[data-rvariant]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.rvariant === reportVariant)));
  const fullName = `${REPORT_THEMES[reportTheme].name}·${reportVariant === 'classic' ? '经典' : '极简'}`;
  $('#active-icon-name').textContent = fullName;
  $('#report-range').textContent = `${model.label} · ${fullName}`;
}

document.querySelectorAll('[data-rtheme]').forEach(btn => {
  btn.addEventListener('click', () => {
    reportTheme = btn.dataset.rtheme;
    userPickedReportTheme = true;
    syncReportControls();
    drawReport();
  });
});

document.querySelectorAll('[data-rvariant]').forEach(btn => {
  btn.addEventListener('click', () => {
    reportVariant = btn.dataset.rvariant;
    syncReportControls();
    drawReport();
  });
});

$('#open-report').onclick = () => {
  if (!userPickedReportTheme) {
    reportTheme = document.documentElement.classList.contains('dark') ? 'gold' : 'sunset';
  }
  syncReportControls();
  $('#report-dialog').showModal();
  drawReport().catch(() => toast('图片生成失败，请重试'));
};

$('#show-books').onchange = () => drawReport();
function png() { return new Promise(resolve => $('#report-canvas').toBlob(resolve, 'image/png')); }
function download(blob) {
  const url = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = url;
  const vName = reportVariant === 'classic' ? '经典' : '极简';
  link.download = `空叶阅读-${model.label.replace(/\s/g, '')}-${REPORT_THEMES[reportTheme].name}${vName}.png`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
$('#save-report').onclick = async () => {
  try { await drawReport(); const blob = await png(); if (!blob) throw Error(); download(blob); toast('阅读报告海报已保存'); }
  catch { toast('保存失败，请重试'); }
};
$('#share-report').onclick = async () => {
  try {
    await drawReport(); const blob = await png(); if (!blob) throw Error();
    const file = new File([blob], '空叶阅读报告.png', { type: 'image/png' });
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file], title: '空叶阅读 · 阅读报告' });
    else { download(blob); toast('浏览器不支持直接分享，已保存海报'); }
  } catch (e) { if (e.name !== 'AbortError') toast('分享未完成，可以尝试保存图片'); }
};
new ResizeObserver(()=>{renderTrend();renderHeatmap();}).observe($('.content'));
render();
</script>
</body>
</html>

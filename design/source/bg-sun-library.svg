<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 540" width="100%" height="100%">
  <!-- 阳光旧书屋 (猫园背景图 · 默认农场同分布 | 1:1 默认农场布局 · viewBox="0 0 260 540") -->
  <g id="bg-sun-library">
  <!-- 1) 顶部天际背景与柔和弧形地面分界线 (1:1 对齐《默认农场.svg》) -->
  <rect x="0" y="0" width="260" height="96" fill="#FEF3C7"/>
  <path d="M0 86 Q130 78 260 86 L260 540 L0 540 Z" fill="#FFFBEB"/>

  <!-- 2) 左上角圆日/天体与水平流云薄雾条 -->
  
            <!-- 丁达尔斜射光束置于太阳下层，严格贴合太阳圆心(53,48)与内外圆切点放射 -->
            <polygon points="30.3,51.9 53,48 74.6,40.1 236,540 72,540" fill="#FDE047" opacity="0.20"/>
            <polygon points="37.2,50.8 53,48 68.1,42.6 204,540 108,540" fill="#F59E0B" opacity="0.13"/>
            <circle cx="53" cy="48" r="23" fill="#F59E0B" opacity="0.24"/>
            <circle cx="53" cy="48" r="16" fill="#F97316" opacity="0.92"/>
          
  <ellipse cx="48" cy="40" rx="36" ry="1.8" fill="#FFFFFF" opacity="0.75"/>
  <ellipse cx="18" cy="64" rx="22" ry="1.3" fill="#FFFFFF" opacity="0.75"/>
  <ellipse cx="108" cy="54" rx="28" ry="1.5" fill="#FFFFFF" opacity="0.75"/>
  <ellipse cx="212" cy="48" rx="42" ry="2" fill="#FFFFFF" opacity="0.75"/>

  
            <!-- 阳光旧书屋专属：空气中漂浮的金色微尘 -->
            <circle cx="84" cy="136" r="2.2" fill="#F59E0B"/><circle cx="142" cy="168" r="2.8" fill="#FBBF24"/>
            <circle cx="116" cy="272" r="2.2" fill="#D97706"/><circle cx="188" cy="396" r="2.6" fill="#F59E0B"/>
          

  <!-- 3) 左上角深色圆角指示路牌 (立柱 x=64, 牌面 x=45..91, y=74..94) -->
  <g>
    <ellipse cx="66" cy="108" rx="11" ry="2.2" fill="#FDE68A"/>
    <rect x="64" y="68" width="4.5" height="40" rx="2.2" fill="#78350F"/>
    <path d="M49 74 H82 C85 74 91 81 91 84 C91 87 85 94 82 94 H49 C46 94 45 92 45 89 V79 C45 76 46 74 49 74 Z" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
  </g>

  <!-- 4) 右上角弧形弯顶烟囱小屋 + 门前3颗鹅卵石步汀 (cx=186, cy=84) -->
  <g>
    <ellipse cx="186" cy="84" rx="30" ry="4.5" fill="#FDE68A"/>
    <!-- 烟囱与袅袅炊烟弧线 -->
    <path d="M174 48 Q182 32 198 22" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <rect x="171" y="48" width="5" height="12" rx="1" fill="#78350F"/>
    <!-- 梯形小屋墙体与砖块斑点 -->
    <path d="M168 62 L204 62 L208 84 L164 84 Z" fill="#FEF3C7"/>
    <rect x="171" y="72" width="5.5" height="2.8" rx="1.4" fill="#D97706" opacity="0.65"/>
    <rect x="169" y="77" width="4" height="2.2" rx="1" fill="#D97706" opacity="0.45"/>
    <rect x="196" y="75" width="5" height="2.6" rx="1.3" fill="#D97706" opacity="0.65"/>
    <!-- 圆拱门洞 -->
    <path d="M182 84 V71 C182 67 191 67 191 71 V84 Z" fill="#451A03"/>
    <!-- 标志性厚重弧形弯屋顶与虚线缝线 -->
    <path d="M161 65 C172 48 200 48 211 65 C208 68 204 66 186 58 C168 66 164 68 161 65 Z" fill="#78350F"/>
    <path d="M165 63 C175 51 197 51 207 63" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75"/>
    <!-- 门前3颗鹅卵石步汀 -->
    <ellipse cx="185" cy="91" rx="2.8" ry="1.1" fill="#FDE68A"/>
    <ellipse cx="188" cy="95" rx="2.5" ry="1" fill="#FDE68A"/>
    <ellipse cx="190" cy="99" rx="2.8" ry="1.1" fill="#FDE68A"/>
  </g>

  <!-- 5) 上层偏左椭圆沙坑/浮岛 (cx=102, cy=202, rx=38, ry=8.5) -->
  <g>
    <ellipse cx="102" cy="202" rx="38" ry="8.5" fill="#FDE68A"/>
    <ellipse cx="102" cy="202" rx="31" ry="6" fill="#FEF3C7"/>
    <!-- 左2右1小草芽与2颗碎石圆点 -->
    <line x1="78" y1="195" x2="77" y2="189" stroke="#D97706" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="80" y1="195" x2="82" y2="190" stroke="#D97706" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="116" y1="195" x2="118" y2="191" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="73" cy="197" r="1.5" fill="#B45309"/>
    <circle cx="125" cy="206" r="1.2" fill="#B45309"/>
  </g>

  <!-- 6) 中层偏右椭圆沙坑/浮岛 (cx=164, cy=328, rx=40, ry=8.5) -->
  <g>
    <ellipse cx="164" cy="328" rx="40" ry="8.5" fill="#FDE68A"/>
    <ellipse cx="164" cy="328" rx="33" ry="6" fill="#FEF3C7"/>
    <!-- 上缘小草芽与左右碎石圆点 -->
    <line x1="153" y1="321" x2="152" y2="316" stroke="#D97706" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="155" y1="321" x2="157" y2="317" stroke="#D97706" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="190" cy="323" r="1.6" fill="#B45309"/>
    <circle cx="140" cy="332" r="1.3" fill="#B45309"/>
  </g>

  <!-- 7) 底层偏左大荷花池塘 (cx=102, cy=462, rx=62, ry=13.5) -->
  <g>
    <!-- 池岸左上与顶部双瓣小草簇 -->
    <path d="M47 456 C46 450 49 450 49 455 C50 450 53 451 52 456 Z" fill="#FDE68A"/>
    <path d="M84 449 C83 444 86 444 86 448 C87 444 90 445 89 449 Z" fill="#FDE68A"/>
    <!-- 池塘内外环 -->
    <ellipse cx="102" cy="462" rx="62" ry="13.5" fill="#D97706"/>
    <ellipse cx="102" cy="462" rx="54" ry="10.5" fill="#FEF08A"/>
    <!-- 池内荷叶与叶脉缺口 + 右侧小圆叶 -->
    <ellipse cx="94" cy="463" rx="15" ry="4.5" fill="#10B981"/>
    <line x1="94" y1="463" x2="100" y2="459" stroke="#FEF08A" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="131" cy="466" rx="7" ry="2.2" fill="#10B981" opacity="0.8"/>
    <!-- 标志性竖立香蒲水草 (x=125) -->
    <line x1="125" y1="468" x2="125" y2="452" stroke="#78350F" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="125" cy="451" rx="3" ry="4.5" fill="#F59E0B"/>
    <!-- 池岸左下与右下白色双瓣小花 -->
    <path d="M54 472 C53 467 56 467 56 471 C57 467 60 468 59 472 Z" fill="#FFFFFF"/>
    <path d="M148 471 C147 466 150 466 150 470 C151 466 154 467 153 471 Z" fill="#FFFFFF"/>
  </g>

  <!-- 8) 地面散落的5处微草符号 (~) 与底部居中返回胶囊按钮 -->
  <g stroke="#FDE68A" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M114 106 Q116 103 117 106 Q119 104 120 106"/>
    <path d="M215 103 Q217 100 218 103 Q220 101 221 103"/>
    <path d="M38 262 Q40 259 41 262 Q43 260 44 262"/>
    <path d="M183 288 Q185 285 186 288 Q188 286 189 288"/>
    <path d="M73 372 Q75 369 76 372 Q78 370 79 372"/>
    <path d="M203 412 Q205 409 206 412 Q208 410 209 412"/>
  </g>
  <g transform="translate(130, 510)">
    <rect x="-27" y="-9.5" width="54" height="19" rx="9.5" fill="#FDE68A" opacity="0.85"/>
    <path d="M-15 -3.5 L-19 0 L-15 3.5" fill="none" stroke="#78350F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
</svg>
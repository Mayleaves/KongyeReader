<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%" fill="none">
    <style>
        @keyframes catBreathe { 0%, 100% { transform: scaleY(1) translateY(0); } 50% { transform: scaleY(1.022) translateY(-1.2px); } }
        @keyframes earTwitchLeft { 0%, 84%, 100% { transform: rotate(0deg); } 88% { transform: rotate(-4.5deg); } 93% { transform: rotate(1.5deg); } }
        @keyframes earTwitchRight { 0%, 60%, 100% { transform: rotate(0deg); } 64% { transform: rotate(4.5deg); } 68% { transform: rotate(0deg); } }
        @keyframes leafFloat { 0%, 100% { transform: rotate(-5deg) translateY(0px); } 50% { transform: rotate(7deg) translateY(-2.5px); } }
        .svg-cat-breathe { animation: catBreathe 4s ease-in-out infinite; transform-origin: 132px 231px; }
        .svg-ear-l { animation: earTwitchLeft 6.5s ease-in-out infinite; transform-origin: 96px 104px; }
        .svg-ear-r { animation: earTwitchRight 7.8s ease-in-out infinite; transform-origin: 144px 104px; }
        .svg-head-leaf { animation: leafFloat 3.4s ease-in-out infinite; transform-origin: 120px 76px; }
    </style>

    <!-- 底部宽椭圆柔和投影 -->
    <ellipse cx="132" cy="233" rx="74" ry="6" fill="#EFEFEF"/>

    <!-- 趴卧揣手呼吸主躯干 -->
    <g class="svg-cat-breathe">
        <!-- 身体与前绕尾巴一体化连续闭合路径：消除脖颈两侧凹坑，同时让右后臀弧线直接平滑过渡为前绕猫尾，彻底根除图2尾巴根部的折角台阶 -->
        <path d="M 65 231 C 61 206, 70 183, 86 177 L 134 177 C 174 177, 203 198, 203 224 C 203 237, 191 244, 168 244.5 C 146 245, 127 244.5, 114 249 C 109 250.8, 106 247.5, 106.5 243.5 C 107 239.5, 110.5 238, 115 237 C 128 234, 148 234.5, 168 234 C 181 233.5, 189 232.2, 191 231 L 65 231 Z" fill="#1E1E22"/>

        <!-- 胸前标志性小领结纹理（随脑袋下移微调位置） -->
        <path d="M 99 199 L 103 203 L 107 199" stroke="#47474E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

        <!-- 胸前“农民揣”折爪线条：微拱柔和的圆弧过渡 -->
        <path d="M 78 214 C 86 211.5, 95 212, 98.5 216.5 C 100.2 218.8, 100.5 222, 100.5 225.5" stroke="#47474E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M 128 214 C 120 211.5, 111 212, 107.5 216.5 C 105.8 218.8, 105.5 222, 105.5 225.5" stroke="#47474E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- 看板猫猫头（下移至 y=161 窝进肩背里，消除脖子断层） -->
        <g transform="translate(103, 161) scale(0.76) translate(-120, -121)">
            <!-- 左耳 (无痕切线衔接) -->
            <g class="svg-ear-l">
                <path d="M74.4 116 C74.4 98, 79 74, 82 59 C83.2 53.5, 90 52.5, 94.2 57.5 L116 86 L108 118 Z" fill="#1E1E22"/>
                <path d="M84 89 L87 69 L98 83" stroke="#3A3A40" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </g>

            <!-- 右耳 (无痕切线衔接) -->
            <g class="svg-ear-r">
                <path d="M165.6 116 C165.6 98, 161 74, 158 59 C156.8 53.5, 150 52.5, 145.8 57.5 L124 86 L132 118 Z" fill="#1E1E22"/>
                <path d="M156 89 L153 69 L142 83" stroke="#3A3A40" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </g>

            <!-- 头顶灵魂设计：「空叶」呆毛 -->
            <g class="svg-head-leaf">
                <path d="M120 79 C120 66, 128 53, 138 56 C138 67, 129 76, 120 79 Z" stroke="#27272A" stroke-width="2.6" stroke-linejoin="round" fill="none"/>
                <path d="M120 79 C117 70, 111 65, 107 67" stroke="#27272A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            </g>

            <!-- 饱满圆润猫头 -->
            <ellipse cx="120" cy="121" rx="46" ry="41" fill="#1E1E22"/>

            <!-- 两侧灵动小胡须 -->
            <line x1="66" y1="124" x2="75" y2="126" stroke="#47474E" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
            <line x1="68" y1="133" x2="76" y2="133" stroke="#47474E" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
            <line x1="174" y1="124" x2="165" y2="126" stroke="#47474E" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
            <line x1="172" y1="133" x2="164" y2="133" stroke="#47474E" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>

            <!-- 安详向下弯弧闭眼 (U U) -->
            <path d="M88 124 Q99 131 110 124" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path d="M130 124 Q141 131 152 124" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>

            <!-- 经典深灰 W 猫猫嘴 -->
            <path d="M113 139.5 Q116.5 143.5 120 139.5 Q123.5 143.5 127 139.5" stroke="#52525B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>
    </g>
</svg>